CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_HWINFO=y
CONFIG_BOOT_GO_HOOKS=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_BOOT_WATCHDOG_FEED=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
# Bootloader self-protection is intentionally disabled for this profile.
# Image signature validation remains enabled (BOOT_VALIDATE_SLOT0 above).
CONFIG_FPROTECT=n
CONFIG_NCS_MCUBOOT_DISABLE_SELF_RWX=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_MCUBOOT_INDICATION_LED=n
CONFIG_WATCHDOG=y
# NVS uses kernel mutexes, even though only the boot thread accesses it.
CONFIG_MULTITHREADING=y
CONFIG_REBOOT=y
CONFIG_PM_PARTITION_REGION_NVS_STORAGE_EXTERNAL=y
CONFIG_PM_PARTITION_SIZE_NVS_STORAGE=0x2000
