# 4 KiB NOR erase sectors; NVS cannot use the driver's default 64 KiB pages.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_JESD216_API=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16
CONFIG_PM_PARTITION_REGION_SETTINGS_STORAGE_EXTERNAL=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x10000

# MCUboot image management and a separate boot-policy NVS journal.
CONFIG_IMG_MANAGER=y
CONFIG_WATCHDOG=y
CONFIG_FLASH_AREA_CHECK_INTEGRITY=y
CONFIG_STREAM_FLASH=y
# Temporarily bypass the startup health/backup prerequisite for OTA commands.
CONFIG_SPS_OTA_HEALTH_CHECK=n
CONFIG_FLASH_AREA_CHECK_INTEGRITY_PSA=y
CONFIG_NRF_SECURITY=y
# Nordic's PSA key import uses the mbed TLS allocator, not the libc heap.
# Without its initialized heap, Ed25519 public-key import fails with PSA -141.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_REBOOT=y

# Zephyr supervises the main task; its timer feeds the inherited WDT30.
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=2
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=10000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=10000

# Authenticate staged OTA images before reboot, using the MCUboot public key.
CONFIG_PSA_WANT_ALG_SHA_512=y
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# Public release directory: manifest.json and its named signed application.
CONFIG_SPS_HTTP_OTA=y
CONFIG_SPS_OTA_BASE_URL="https://raw.githubusercontent.com/haseebzaib/SPS_OTA_UPDATE/main/dfu_application/"
